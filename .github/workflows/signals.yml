name: signals

on:
  schedule:
    # GitHub cron UTC me chalta hai (IST se 5:30 pehle). 15m candle band hone ke ~2 min baad, Mon-Fri.
    # IST me ye :32, :47, :02, :17 minute par chalta hai. GitHub cron me 5-15 min delay normal hai.
    - cron: "2,17,32,47 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write   # state/state.json commit karne ke liye

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - run: playwright install --with-deps chromium

      - name: Restore HeatCharting session
        run: echo "${{ secrets.HEAT_STATE }}" | base64 -d > heat_state.json

      - name: Run pipeline
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SYMBOLS: "EURUSD,GBPUSD,USDJPY,AUDUSD,USDCAD"
          TZ: Asia/Kolkata
          TIMEFRAME_MIN: "15"
          SIGNAL_MODE: all
        run: python -m src.main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: downloads
          path: downloads/
          retention-days: 3
          if-no-files-found: ignore

      - name: Save state
        if: always()
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state/state.json || true
          git diff --cached --quiet || (git commit -m "state: update" && git push)
